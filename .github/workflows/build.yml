name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and check
        run: ./build.sh
      - name: Check real TCP listener
        run: python3 scripts/live-check.py
